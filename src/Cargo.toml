[workspace]
members = [
  "crates/usque-config",
  "crates/usque-crypto",
  "crates/usque-cloudflare-api",
  "crates/usque-masque",
  "crates/usque-tunnel-core",
  "crates/usque-tun-platform",
  "crates/usque-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/FireMasterK/usque-rs"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage"]}
crossfire = "3.1"
etherparse = "0.21"
futures = "0.3"
futures-util = "0.3"
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = {version = "0.0.10", features = ["datagram"]}
hex = "0.4"
http = "1"
humantime = "2"
libc = "0.2"
parking_lot = "0.13"
pem = "4"
quinn = {version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"]}
rcgen = {version = "0.14", default-features = false, features = ["pem", "crypto", "ring"]}
ring = "0.17"
rtnetlink = "0.23"
rustls = {version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"]}
rustls-pki-types = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
tokio = {version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"]}
tokio-rustls = {version = "0.26", default-features = false, features = ["ring", "logging", "tls12"]}
tracing = "0.1"
tracing-subscriber = {version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log"]}
tun = {version = "0.8", features = ["async"]}
usque-cloudflare-api = {path = "crates/usque-cloudflare-api"}
usque-config = {path = "crates/usque-config"}
usque-crypto = {path = "crates/usque-crypto"}
usque-masque = {path = "crates/usque-masque"}
usque-tun-platform = {path = "crates/usque-tun-platform"}
usque-tunnel-core = {path = "crates/usque-tunnel-core"}
webpki-roots = "1"

# Size-oriented release profile for the OpenWrt (armv7-musl) target. The
# binary is additionally stripped with the target `strip` when
# cross-compiling (see build/build-usque.sh).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
