[package]
name = "usque-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# HTTP/3 (QUIC) is the only MASQUE transport and is always compiled in. The
# feature is kept as a no-op so callers that pass `FEATURES=quinn` to
# build/build-usque.sh (the packaging workflow) keep working.
quinn = ["usque-masque/quinn"]

[lib]
name = "usque_cli"
path = "src/lib.rs"

[[bin]]
name = "usque"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossfire.workspace = true
humantime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
usque-cloudflare-api.workspace = true
usque-config.workspace = true
usque-crypto.workspace = true
usque-masque.workspace = true
usque-tun-platform.workspace = true
usque-tunnel-core.workspace = true
